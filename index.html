<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Prep Quiz App</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .topic-card {
            cursor: pointer;
            transition: transform 0.2s, shadow 0.2s;
        }
        .topic-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .option-btn {
            text-align: left;
            margin-bottom: 10px;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">ExamPrep Portal</a>
        </div>
    </nav>

    <div class="container my-5">
        
        <!-- SECTION 1: Topics List (Index Page) -->
        <div id="topics-view">
            <h2 class="mb-4 text-center">Apna Topic Chunein</h2>
            <div class="row g-4" id="topics-container">
                <!-- Topics JSON se auto generate honge -->
            </div>
        </div>

        <!-- SECTION 2: Quiz View -->
        <div id="quiz-view" class="d-none">
            <button class="btn btn-outline-secondary mb-4" onclick="showTopics()">&larr; Back to Topics</button>
            
            <div class="card shadow-sm mx-auto" style="max-width: 700px;">
                <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                    <h5 class="m-0" id="quiz-topic-title">Topic Name</h5>
                    <span class="badge bg-secondary" id="question-tracker">Question 1/10</span>
                </div>
                <div class="card-body p-4">
                    <h5 class="card-title mb-4" id="question-text">Question goes here?</h5>
                    <div id="options-container" class="d-grid gap-2">
                        <!-- MCQ Options yahan aayenge -->
                    </div>
                    <div id="feedback" class="mt-3 font-weight-bold"></div>
                </div>
                <div class="card-footer bg-white text-end py-3">
                    <button id="next-btn" class="btn btn-primary d-none" onclick="nextQuestion()">Next Question &rarr;</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        let allTopicsData = [];
        let currentQuestions = [];
        let currentQuestionIndex = 0;

        // Fetch JSON Data on Page Load
        document.addEventListener('DOMContentLoaded', () => {
            fetch('questions.json')
                .then(response => response.json())
                .then(data => {
                    allTopicsData = data;
                    renderTopics(data);
                })
                .catch(error => {
                    console.error('Error loading JSON:', error);
                    document.getElementById('topics-container').innerHTML = 
                        '<div class="col-12 text-center text-danger">Error loading questions. Check JSON file path.</div>';
                });
        });

        // 1. Render Topics as Bootstrap Cards
        function renderTopics(topics) {
            const container = document.getElementById('topics-container');
            container.innerHTML = '';

            topics.forEach(topic => {
                const cardHTML = `
                    <div class="col-md-4 col-sm-6">
                        <div class="card h-100 topic-card border-0 shadow-sm" onclick="startQuiz('${topic.topicId}')">
                            <div class="card-body">
                                <h5 class="card-title text-primary">${topic.topicName}</h5>
                                <p class="card-text text-muted">${topic.description}</p>
                                <span class="badge bg-light text-dark">${topic.questions.length} Questions</span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // Array Shuffle Helper (Randomise function)
        function shuffleArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // 2. Start Quiz for Selected Topic
        function startQuiz(topicId) {
            const selectedTopic = allTopicsData.find(t => t.topicId === topicId);
            if (!selectedTopic || selectedTopic.questions.length === 0) {
                alert('Is topic me abhi koi questions nahi hain!');
                return;
            }

            document.getElementById('quiz-topic-title').innerText = selectedTopic.topicName;
            
            // Randomise Questions
            currentQuestions = shuffleArray([...selectedTopic.questions]);
            currentQuestionIndex = 0;

            document.getElementById('topics-view').classList.add('d-none');
            document.getElementById('quiz-view').classList.remove('d-none');

            loadQuestion();
        }

        // 3. Load Single Question
        function loadQuestion() {
            const q = currentQuestions[currentQuestionIndex];
            
            document.getElementById('question-tracker').innerText = `Question ${currentQuestionIndex + 1}/${currentQuestions.length}`;
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('feedback').innerText = '';
            document.getElementById('next-btn').classList.add('d-none');

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-outline-primary option-btn p-3';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, q.answer, btn);
                optionsContainer.appendChild(btn);
            });
        }

        // 4. Check Selected Answer
        function checkAnswer(selectedIndex, correctIndex, selectedBtn) {
            const allOptionBtns = document.querySelectorAll('.option-btn');
            
            // Disable all buttons once selected
            allOptionBtns.forEach(btn => btn.disabled = true);

            if (selectedIndex === correctIndex) {
                selectedBtn.classList.remove('btn-outline-primary');
                selectedBtn.classList.add('btn-success');
                document.getElementById('feedback').innerHTML = '<span class="text-success">✓ Sahi Jawab!</span>';
            } else {
                selectedBtn.classList.remove('btn-outline-primary');
                selectedBtn.classList.add('btn-danger');
                allOptionBtns[correctIndex].classList.remove('btn-outline-primary');
                allOptionBtns[correctIndex].classList.add('btn-success');
                document.getElementById('feedback').innerHTML = '<span class="text-danger">✗ Galat Jawab!</span>';
            }

            document.getElementById('next-btn').classList.remove('d-none');
        }

        // 5. Next Question / Finish
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                alert('Quiz Khatam ho gaya hai! Wapas Topic screen par ja rahe hain.');
                showTopics();
            }
        }

        // 6. Back to Topic List
        function showTopics() {
            document.getElementById('quiz-view').classList.add('d-none');
            document.getElementById('topics-view').classList.remove('d-none');
        }
    </script>
</body>
</html>
